# gameqker · 每日巡检并刷新情报表
#
# 北京时间每天 06:00（UTC 22:00）跑一次 collector.update：
#   - 巡检 Steam 美区商店与各游戏官网，只改写 last_checked / steam_listed /
#     steam_release_date / official_signal 四个自动字段；
#   - 每次巡检后提交 data/games.json、web/data/games.json 与倒计时数据
#     data/events.json、web/data/events.json。
#     注意：last_run_at / generated_at / reports 每轮都会变，所以实际上基本每天都会产生
#     一次 commit，正好把每天的完整数据留成快照历史（可用 git show <sha>:data/games.json 取回）。
#
# 说明：GitHub 仓库已配置好（origin 走 ssh://git@ssh.github.com:443，本机 22 端口被拒，
# 所以端口固化在 remote 里，日常 push 不需要额外环境变量）。本地巡检与 Actions 都会提交
# 同一批数据文件，两边各自「先 rebase 再 push」，避免互相把对方顶成非快进。
# 最后一步会把静态站同步到阿里云（/www/wwwroot/sites/gameqker/）：需要仓库里配好
# SSH_HOST / SSH_USER / SSH_KEY 三个 Secrets，且服务器已安装 rsync。

name: refresh-intel

on:
  schedule:
    # UTC 22:00 = 北京时间次日 06:00
    - cron: '0 22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'collector/**'
      - '.github/workflows/update.yml'

permissions:
  contents: write

concurrency:
  group: refresh-intel
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 需要完整历史：下面推数据前要靠 rebase 对齐本地的巡检提交
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 巡检（Steam + 官网）
        # --no-git：快照提交交给下面那一步，由 Actions 自己 commit + push
        run: python -m collector.update --budget-seconds 300 --no-git

      - name: 提交数据变更
        run: |
          git config user.name "gameqker-bot"
          git config user.email "gameqker-bot@users.noreply.github.com"
          git add data/games.json web/data/games.json data/events.json web/data/events.json
          if git diff --cached --quiet; then
            echo "本轮无数据变更，跳过提交"
          else
            git commit -m "chore(data): refresh gameqker intel"
            # 本地巡检也会提交同一批数据文件，先对齐再推，避免非快进被拒。
            # -X theirs：rebase 里 theirs 指「正在被应用的那条提交」＝本次这条快照，
            # 所以冲突处取本次采集的结果（谁后跑谁说了算，数据更新鲜）。
            git pull --rebase -X theirs origin main
            git push
          fi

      # ----------------------------------------------------------------------
      # 把静态站同步到阿里云（nginx 子路径 /www/wwwroot/sites/gameqker/）
      # 依赖：仓库 Secrets SSH_HOST / SSH_USER / SSH_KEY，服务器已装 rsync。
      # ----------------------------------------------------------------------
      - name: 推送静态站到阿里云
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            web/ "$SSH_USER@$SSH_HOST:/www/wwwroot/sites/gameqker/"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "chown -R www:www /www/wwwroot/sites/gameqker && find /www/wwwroot/sites/gameqker -type d -exec chmod 755 {} \; && find /www/wwwroot/sites/gameqker -type f -exec chmod 644 {} \;"
      # ----------------------------------------------------------------------
